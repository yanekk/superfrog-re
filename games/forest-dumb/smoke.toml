# What Forest Dumb runs in smoke (smoke-tests DESIGN §2.2, §2.4, §2.5). Fast files are all smoke.
workspace = "engine"

[tests]
"crates/fd-conform/src" = "smoke"
# 60 s for the title on every pass, which the area needs; the three missing-file tests take under a second.
# a_start_one_frame_early_is_caught_and_named (16 s) stays in full.
"crates/fd-conform/tests/first_case.rs" = [
    "the_idle_title_matches_the_original_on_every_pass",
    "a_missing_disk_names_the_path",
    "a_missing_kickstart_names_the_path_and_does_not_panic",
    "a_missing_case_names_the_path_and_does_not_panic",
]
# The key and missing-input tests take a second; the two that boot to W1-1 (about 16 s each, the
# first on a machine with no cache) stay in full.
"crates/fd-conform/tests/level_sync.rs" = [
    "a_changed_script_disk_or_kickstart_changes_the_key",
    "a_missing_kickstart_names_the_path",
    "missing_disks_name_the_path",
]
"crates/fd-conform/tests/purity.rs" = "smoke"
# T05: level 1's files against the original at the cached sync point, 3.4 s warm; a machine with no
# sync cache boots to W1-1 once first (about 16 s).
"crates/fd-conform/tests/level_files.rs" = "smoke"
# The routine rig and the port register: about 3 s, the rig half on the program from disk 1.
"crates/fd-conform/tests/ported.rs" = "smoke"
"crates/fd-conform/tests/rig.rs" = "smoke"
# T60: branch coverage on the original, a hand-made routine and two generators: under a second.
"crates/fd-conform/tests/rig_branches.rs" = "smoke"
# T06: the level case runner against a stand-in copy of the original, from the cached sync point:
# 9 s warm (runner.rs, ten short runs in parallel) and 3 s (input_timing.rs). A machine with no
# sync cache boots to W1-1 once first (about 16 s).
"crates/fd-conform/tests/runner.rs" = "smoke"
"crates/fd-conform/tests/input_timing.rs" = "smoke"
# T07: the level engine entering W1-1 against the original, and its idle case (200 frames, also
# through the command line): 2 s warm. A machine with no sync cache boots to W1-1 once first.
"crates/fd-conform/tests/level_entry.rs" = "smoke"
# The translation judge on h0+$774, under a second.
"crates/fd-conform/tests/judge.rs" = "smoke"
# T37's drawing generators: the 2 000-state survey, the write check and the flip self-test, about 4 s.
# each_branch_goes_both_ways_or_is_named (about 27 s, three runs a branch) stays in full.
"crates/fd-conform/tests/gen_drawing.rs" = [
    "every_drawing_entry_has_its_generator_and_its_lists",
    "each_generator_runs_2000_states_on_the_original_with_no_hang",
    "no_generator_writes_outside_what_its_routine_reads",
    "the_flips_see_a_branch_that_goes_one_way",
]
# T35: the character routines' generators, 2 000 states each and every branch both ways, about 2.5 s.
"crates/fd-conform/tests/gen_character.rs" = "smoke"
# T36's camera generators against the original, branches both ways: under a second.
"crates/fd-conform/tests/gen_camera.rs" = "smoke"
# T09: the camera's engine port against the original, 10 000 states a routine and the negative
# checks: about 3 s on the program from disk 1.
"crates/fd-conform/tests/camera_routines.rs" = "smoke"
# T55: the edge redraws' engine port. Registration, the pointer tables, the d0 carry's negative check
# and collision_map after a scroll each way from the cached sync point, about 7 s. The 10 000-state
# check of all 14 routines (about 7 min) and the cell-table filter's count (16 s) stay in full.
"crates/fd-conform/tests/edge_redraw_routines.rs" = [
    "every_t55_routine_is_registered_and_checked_here",
    "the_pointer_tables_are_sixteen_rotated_bands",
    "a_row_bob_dropping_the_high_word_of_d0_fails",
    "a_state_with_d7_past_the_slots_is_one_the_engine_does_not_model",
    "after_a_scroll_each_way_the_collision_map_equals_the_originals",
    "the_edge_latches_step_with_the_original_over_the_idle_case",
]
# T38's objects generators against the original, branches both ways: under 2 s.
"crates/fd-conform/tests/gen_objects.rs" = "smoke"
# T54: the creature movement and sort generators, every branch both ways: under 3 s.
"crates/fd-conform/tests/gen_objects_move.rs" = "smoke"
# T39: the rest generators, game_frame over the cached sync point's RAM, every branch both ways: about 2 s warm.
"crates/fd-conform/tests/gen_rest.rs" = "smoke"
# T56: the edge redraws' generators, the 2 000-state survey, the write check and the beam sync, about 4 s.
# each_branch_goes_both_ways_or_is_named (about 55 s, three runs a branch) stays in full.
"crates/fd-conform/tests/gen_edge_redraw.rs" = [
    "every_t56_entry_has_its_generator_and_its_lists",
    "each_generator_runs_2000_states_on_the_original_with_no_hang",
    "no_generator_writes_outside_what_its_routine_reads",
    "the_beam_sync_sets_the_raster_and_runs_repeat",
]
# T53: the walk-animation and joystick routines' generators, branches both ways: under a second.
"crates/fd-conform/tests/gen_character_anim.rs" = "smoke"
# T51: the animation pickers and read_joystick against the original, 10 000 states each, under 2 s.
"crates/fd-conform/tests/character_anim_routines.rs" = "smoke"
# T08: the character's movement against the original, 14 routines at 10 000 states each and 5
# mutants, about 9 s (one rig per test, run in parallel).
"crates/fd-conform/tests/character_routines.rs" = "smoke"
# T21: what each object value of W1-1 does, scripted slides from the cached sync point, 3 s warm;
# the map and note checks read disk 2. A machine with no sync cache boots to W1-1 once first.
"crates/fd-conform/tests/object_claims.rs" = "smoke"
# Three boots to W1-1, about 32 s together: the measurements of docs/09-play-measured.md.
"crates/fd-conform/tests/play_measured.rs" = "full"
# One boot to W1-1 (title and play), 12 to 27 s: picture_in on the whole play picture (T04).
"crates/fd-conform/tests/play_picture.rs" = "full"
"crates/fd-assets/src" = "smoke"
"crates/fd-core/src" = "smoke"
"crates/fd-tools/tests/bad_disks.rs" = "smoke"
"crates/fd-tools/tests/boot_chain.rs" = "smoke"
"crates/fd-tools/tests/exe_map_claims.rs" = "smoke"
"crates/fd-tools/tests/locate.rs" = "smoke"
"crates/fd-tools/tests/real_disks.rs" = "smoke"
"crates/fd-tools/tests/unpack.rs" = "smoke"

[python]
"tools/test_call_tree.py" = "smoke"
"tools/test_find_file_names.py" = "smoke"
# T61: model calls stubbed, no network. The judge one builds three canned generators into fd-judge: about 4 s warm.
"tools/test_generate.py" = "smoke"
"tools/test_generate_judge.py" = "smoke"
"tools/test_re_listing.py" = "smoke"
"tools/test_render_levels.py" = "smoke"
# Model calls stubbed, no network. The second builds canned ports into fd-judge: about 8 s warm.
"tools/test_translate.py" = "smoke"
"tools/test_translate_batch.py" = "smoke"
"tools/test_translate_judge.py" = "smoke"
"tools/test_unpack.py" = "smoke"

[[area]]
name = "reading its disks"
covers = ["crates/fd-tools/tests/real_disks.rs"]

[[area]]
name = "its first comparison with the original"
covers = ["crates/fd-conform/tests/first_case.rs::the_idle_title_matches_the_original_on_every_pass"]

[[area]]
name = "unpacking its packed files in Rust"
covers = ["crates/fd-tools/tests/unpack.rs::every_esl_file_unpacks_to_the_sha1_in_the_doc"]

[[area]]
name = "reading its level files"
covers = ["crates/fd-conform/tests/level_files.rs::every_level_1_file_equals_the_bytes_at_its_target_at_the_sync_point"]

[[area]]
name = "comparing a ported routine with the original"
covers = ["crates/fd-conform/tests/rig.rs", "crates/fd-conform/tests/ported.rs"]

[[area]]
name = "the camera following the character"
covers = ["crates/fd-conform/tests/camera_routines.rs::every_camera_routine_matches_the_original"]

[[area]]
name = "the map's edges redrawn into collision_map as the view scrolls"
covers = ["crates/fd-conform/tests/edge_redraw_routines.rs::after_a_scroll_each_way_the_collision_map_equals_the_originals"]

[[area]]
name = "judging a generator by the branches it covers on the original"
covers = ["crates/fd-conform/tests/rig_branches.rs"]

[[area]]
name = "judging a level case against the original"
covers = [
    "crates/fd-conform/tests/runner.rs",
    "crates/fd-conform/tests/input_timing.rs",
]

[[area]]
name = "the character's movement against the original"
covers = ["crates/fd-conform/tests/character_routines.rs::every_t08_routine_is_registered_and_passes_the_rig"]

[[area]]
name = "entering level 1 on the engine"
covers = ["crates/fd-conform/tests/level_entry.rs"]

[[area]]
name = "translating a routine through Muse, judged on the original"
covers = ["crates/fd-conform/tests/judge.rs", "tools/test_translate.py", "tools/test_translate_judge.py"]

[[area]]
name = "having Muse write a generator, judged by its coverage on the original"
covers = ["tools/test_generate.py", "tools/test_generate_judge.py"]
