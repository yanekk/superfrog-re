# What Forest Dumb runs in smoke (smoke-tests DESIGN §2.2, §2.4, §2.5). Fast files are all smoke.
workspace = "engine"

[tests]
"crates/fd-conform/src" = "smoke"
# 60 s for the title on every pass, which the area needs; the three missing-file tests take under a second.
# a_start_one_frame_early_is_caught_and_named (16 s) stays in full.
"crates/fd-conform/tests/first_case.rs" = [
    "the_idle_title_matches_the_original_on_every_pass",
    "a_missing_disk_names_the_path",
    "a_missing_kickstart_names_the_path_and_does_not_panic",
    "a_missing_case_names_the_path_and_does_not_panic",
]
# The key and missing-input tests take a second; the two that boot to W1-1 (about 16 s each, the
# first on a machine with no cache) stay in full.
"crates/fd-conform/tests/level_sync.rs" = [
    "a_changed_script_disk_or_kickstart_changes_the_key",
    "a_missing_kickstart_names_the_path",
    "missing_disks_name_the_path",
]
"crates/fd-conform/tests/purity.rs" = "smoke"
# T05: level 1's files against the original at the cached sync point, 3.4 s warm; a machine with no
# sync cache boots to W1-1 once first (about 16 s).
"crates/fd-conform/tests/level_files.rs" = "smoke"
# The routine rig and the port register: about 3 s, the rig half on the program from disk 1.
"crates/fd-conform/tests/ported.rs" = "smoke"
"crates/fd-conform/tests/rig.rs" = "smoke"
# The translation judge on h0+$774, under a second.
"crates/fd-conform/tests/judge.rs" = "smoke"
# Three boots to W1-1, about 32 s together: the measurements of docs/09-play-measured.md.
"crates/fd-conform/tests/play_measured.rs" = "full"
# One boot to W1-1 (title and play), 12 to 27 s: picture_in on the whole play picture (T04).
"crates/fd-conform/tests/play_picture.rs" = "full"
"crates/fd-assets/src" = "smoke"
"crates/fd-core/src" = "smoke"
"crates/fd-tools/tests/bad_disks.rs" = "smoke"
"crates/fd-tools/tests/boot_chain.rs" = "smoke"
"crates/fd-tools/tests/exe_map_claims.rs" = "smoke"
"crates/fd-tools/tests/locate.rs" = "smoke"
"crates/fd-tools/tests/real_disks.rs" = "smoke"
"crates/fd-tools/tests/unpack.rs" = "smoke"

[python]
"tools/test_call_tree.py" = "smoke"
"tools/test_find_file_names.py" = "smoke"
"tools/test_re_listing.py" = "smoke"
"tools/test_render_levels.py" = "smoke"
# Model calls stubbed, no network. The second builds canned ports into fd-judge: about 8 s warm.
"tools/test_translate.py" = "smoke"
"tools/test_translate_judge.py" = "smoke"
"tools/test_unpack.py" = "smoke"

[[area]]
name = "reading its disks"
covers = ["crates/fd-tools/tests/real_disks.rs"]

[[area]]
name = "its first comparison with the original"
covers = ["crates/fd-conform/tests/first_case.rs::the_idle_title_matches_the_original_on_every_pass"]

[[area]]
name = "unpacking its packed files in Rust"
covers = ["crates/fd-tools/tests/unpack.rs::every_esl_file_unpacks_to_the_sha1_in_the_doc"]

[[area]]
name = "reading its level files"
covers = ["crates/fd-conform/tests/level_files.rs::every_level_1_file_equals_the_bytes_at_its_target_at_the_sync_point"]

[[area]]
name = "comparing a ported routine with the original"
covers = ["crates/fd-conform/tests/rig.rs", "crates/fd-conform/tests/ported.rs"]

[[area]]
name = "translating a routine through Muse, judged on the original"
covers = ["crates/fd-conform/tests/judge.rs", "tools/test_translate.py", "tools/test_translate_judge.py"]
