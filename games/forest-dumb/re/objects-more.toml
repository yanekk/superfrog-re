# The object values worlds 2 to 6 hold that W1-1's table (objects-W1-1.toml) lacks: today only $34,
# the flame (plan forest-dumb-map-page T01, 2026-11-20). The code dispatches on the value alone, the
# same in every world (docs/10-object-system.md), so these groups hold game-wide. Every
# re/objects-*.toml is read together; a value two tables put in different groups fails
# fd-conform/tests/object_tables.rs, naming both files.
#
# value       the object byte
# group       the map page's group; flame is its own, drawn on the springs, blocks and exit layer
# name        what the page calls it
# count       cells holding it in the used columns, per world, as shipped
# seen        an example cell in each world holding it
# measured    how it was measured on the oracle

[[value]]
value = 0x34
group = "flame"
name = "flame"
count = "W3-1 31, W4-1 10, W5-1 25, W6-1 17"
seen = "W3-1:6,47, W4-1:22,33, W5-1:7,25, W6-1:47,7"
what = "h0_62b6 blits _Plomien (h4+$a298, frame by anim_tick) over the cell and the one below; h0_26ec ignores it, so no state changes"
measured = "placed in W1-1 on the slide at W1-1:24,20 and 36,30, object_claims.rs::value_34_is_a_flame_that_changes_no_state"
