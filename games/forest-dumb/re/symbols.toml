# Our names for places in Forest Dumb Forever's main program. Committed; the listing they label is not.
# Read by games/forest-dumb/tools/re_listing.py; the map is docs/07-executable-map.md.
#
# exe    always "forest_dumb_forever"
# hunk   hunk index
# offset byte offset within that hunk
# name   identifier, unique
# kind   func | data | table | var
# size   bytes; required for data, table and var, which may not overlap
#        keep it even where code follows: the sweep resumes where the symbol ends, and from an odd
#        address it decodes noise up to the next symbol (exe_map_claims checks hunk 0)
# note   one line

[[sym]]
exe = "forest_dumb_forever"
hunk = 0
offset = 0x0
name = "entry"
kind = "func"
note = "saves registers, prompts for disk 2, reads the marker, then the start-up below"

