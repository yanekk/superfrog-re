# Every value W1-1's object map (_MapaBobow1, its 240 used columns) holds, with what it does and the
# task that ports it (plan forest-dumb-level-1, T21). Measured on the oracle by
# engine/crates/fd-conform/tests/object_claims.rs; the account is docs/10-object-system.md.
#
# value       the object byte
# count       cells holding it in the file as shipped
# example     one spot, W1-1:col,row
# group       creature | spring | item | water | vanishing-block | bonus | exit
# what        what it does, measured unless the line says "reading"
# seen        walk: met on the scripted slide with the map as shipped; placed: put on the slide's path
#             at the sync point; the claim test names the cell
# port_task   the task that ports what the value does (T22, T24 or T25)
# routines    re/translate.toml names of the routines the value runs through, the drawing and the
#             spawn included; every one is already in game_frame's or the edge redraws' call tree
#
# fd-conform/tests/ported.rs fails when the file holds a value missing here.

[[value]]
value = 0x01
count = 77
example = "W1-1:2,89"
group = "creature"
what = "spawns creature kind 0 when its cell comes into view; reading: flies at the character on a 32-step path (h0+$30fe, $313e)"
seen = "walk"
port_task = "T24"
routines = ["h0_681c", "h0_6852", "h0_2fae", "h0_2fea", "h0_2dd6", "h0_2e0e", "h0_3698", "h0_2c7e", "h0_5e44", "h0_2d4c", "h0_5820", "char_hit_check", "h0_3dd8"]

