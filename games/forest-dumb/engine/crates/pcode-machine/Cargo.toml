[package]
name = "pcode-machine"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure (translator DESIGN §3.1): the machine translated code runs on. Names no game; the program's
# bytes, its hunk bases and the RAM sizes arrive as input.
[dependencies]
pcode-rt = { path = "../pcode-rt" }
# The beam: a position from counted CPU cycles.
amiga-clock = { path = "../../../../../toolkit/crates/amiga-clock" }
# The hunk file's parser.
amiga-disk = { path = "../../../../../toolkit/crates/amiga-disk" }
# Which custom registers are Paula's; the blitter, the copper, the picture and the sprites (T24).
amiga-chips = { path = "../../../../../toolkit/crates/amiga-chips" }
# The keyboard's bytes, the joystick word and the per-frame input the hand engine also takes.
amiga-input = { path = "../../../../../toolkit/crates/amiga-input" }
# Paula's writes, as the oracle and the mixer hold them.
amiga-paula = { path = "../../../../../toolkit/crates/amiga-paula" }
