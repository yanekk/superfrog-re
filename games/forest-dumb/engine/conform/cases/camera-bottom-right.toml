# T43: the camera at the bottom and right ends of W1-1 and back (scripts/camera-bottom-right.txt), the
# long run of the edge-redraw hand-off, state only, creatures frozen (T75, below). Since T47 springs and the
# animated cells run on both sides; at pass 495 a long pass has main_loop's frame_flag clear swallow its
# down latch, so edge_latch_down differs on that pass, which the engine does not model (T74).
# Goal: camera_y at its clamp $53f and camera_x at its furthest, $dc9, with the character against
# the right wall at column 229: the view's right edge reaches column 241, past column 240's filler.
# Contact (char_hit_check on the engine's CLXDAT, T70) is compared: on this route it counts hits_taken
# without costing a life. Bonuses are drawn and taken on both sides since T22.
# Creatures frozen on both sides (freeze.rs h0_681c, T75): live, a creature started at pass 93 a pass later in the
# original, its redraw cut short by a late pass (T46, FINDINGS).
sync = { script = "boot-to-level1", frame = 6301 }
input = "camera-bottom-right"
frames = 1880
compare = ["vars"]
vars = ["clxdat_copy", "hits_taken", "camera_x", "camera_y", "char_screen_x", "char_x", "char_y", "edge_latch_right", "edge_latch_left", "edge_latch_up", "edge_at_right_x", "edge_at_right_y", "edge_at_left_x", "edge_at_left_y", "edge_at_up_x", "edge_at_up_y", "edge_at_down_x", "edge_at_down_y", "lives", "irq_count"]
goal = { all = [{ var = "camera_x", value = 0xdc9 }, { var = "camera_y", value = 0x53f }], by_frame = 8181 }
freeze = true
exclude = [{ what = "var edge_latch_down", task = "T74" }]
