# T43: the camera at the bottom and right ends of W1-1 and back (scripts/camera-bottom-right.txt), the
# long run of the edge-redraw hand-off, state only, creatures live (below). Since T47 springs and the
# animated cells run on both sides, so passes are longer and some cut main_loop's redraws: the runner
# hands the engine where (T74, docs/09).
# Goal: camera_y at its clamp $53f and camera_x at its furthest, $dc9, with the character against
# the right wall at column 229: the view's right edge reaches column 241, past column 240's filler.
# Contact (char_hit_check on the engine's CLXDAT, T70) is compared: on this route it counts hits_taken
# without costing a life. Bonuses are drawn and taken on both sides since T22.
# Creatures live on both sides since T75: where a late pass cuts an edge redraw before its scan starts
# a creature, the runner hands the cut and the engine starts it after that pass too (docs/10).
# The script is the frozen run's with waits and jumps added (2 165 steps for 1 880) so the character
# still reaches both ends; four lives are lost to contact on the way.
sync = { script = "boot-to-level1", frame = 6301 }
input = "camera-bottom-right"
frames = 2165
compare = ["vars"]
vars = ["clxdat_copy", "hits_taken", "camera_x", "camera_y", "char_screen_x", "char_x", "char_y", "edge_latch_right", "edge_latch_left", "edge_latch_up", "edge_at_right_x", "edge_at_right_y", "edge_at_left_x", "edge_at_left_y", "edge_at_up_x", "edge_at_up_y", "edge_at_down_x", "edge_at_down_y", "lives", "irq_count", "edge_latch_down", "creature_active+$0", "creature_active+$1", "creature_active+$2", "creature_active+$3", "creature_active+$4", "creature_slots+$0", "creature_slots+$4", "creature_slots+$8", "creature_slots+$c", "creature_slots+$10", "creature_slots+$14", "creature_slots+$18", "creature_slots+$1c", "creature_slots+$20", "creature_slots+$24"]
goal = { all = [{ var = "camera_x", value = 0xdc9 }, { var = "camera_y", value = 0x53f }], by_frame = 8466 }
