# T70: the collision model frame by frame over W1-1 (scripts/contact-route.txt, fd-plan's route to the
# exit's cells), frozen as freeze.rs says: CLXDAT as char_hit_check copies it (clxdat_copy) and what contact
# counts, with the character, on all of the route's passes. Since T47 the water is drawn in every case,
# and the route drops into the pool at W1-1:195..197,94 (frame 7483), where its contact costs a life:
# the goal, char_x $c44, char_y $5c4 in the water, lives 31. It no longer reaches the exit's cells.
# Creatures frozen on both sides (freeze.rs h0_681c, T75): live, a creature started at pass 641 a pass later in the
# original, its redraw cut short by a late pass (T46, FINDINGS).
sync = { script = "boot-to-level1", frame = 6301 }
input = "contact-route"
frames = 1300
compare = ["vars"]
vars = ["clxdat_copy", "hits_taken", "lives", "char_dying", "char_dying_t", "char_unhurt_t", "char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_anim_ptr", "char_rising", "char_falling", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "irq_count", "countdown"]
goal = { all = [{ var = "char_x", value = 0xc44 }, { var = "char_y", value = 0x5c4 }, { var = "lives", value = 0x31 }], by_frame = 7516 }
freeze = true
