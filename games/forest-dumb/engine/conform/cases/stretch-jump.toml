# T11: jumping, T41's character-run-jumps joined to character-run-landing (scripts/stretch-jump.txt):
# standing jumps tapped and held, up on a landing frame, in the air and held through a landing, then
# left on a landing frame and a run to the wall, char_x $1b, char_y $88, the goal. Variables and picture
# together; nothing frozen. The countdown is T23's.
sync = { script = "boot-to-level1", frame = 6400 }
input = "stretch-jump"
frames = 540
compare = ["vars", "picture"]
vars = ["char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_walk_t", "char_facing", "char_probe_1", "char_probe_2", "char_anim_ptr", "joy_left", "joy_right", "joy_up", "joy_down", "input_log_index", "char_jump_3b28", "char_jump_41b4", "char_jump_41b6", "char_dying_t", "char_dying", "char_rising", "char_falling", "char_probe_3", "char_probe_4", "char_probe_5", "char_probe_6", "char_slide_t", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "char_samples_0", "char_samples_4", "char_samples_8", "char_samples_c", "char_update_t", "char_unhurt_t", "edge_latch_right", "edge_latch_left", "edge_latch_up", "edge_latch_down", "edge_at_right_x", "edge_at_right_y", "edge_at_left_x", "edge_at_left_y", "edge_at_up_x", "edge_at_up_y", "edge_at_down_x", "edge_at_down_y", "lives", "hits_taken", "items_left", "score", "irq_count"]
goal = { all = [{ var = "char_x", value = 0x1b }, { var = "char_y", value = 0x88 }], by_frame = 6940 }
exclude = [{ what = "var countdown", task = "T23" }, { what = "rows 223..231 cols 144..168", task = "T23" }]
