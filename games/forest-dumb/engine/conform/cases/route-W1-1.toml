# T48: the whole of W1-1 on the original (DESIGN §1, §2.11): the route scripts/route-W1-1.txt from
# the level sync point to the step the original runs next_world in, nothing frozen. The character,
# the camera, the status variables, the collision register's copy and every creature slot and flag
# on every pass. Goal: the level's end found in the same step on both sides. tests/full_route.rs
# holds that no life is lost on the way and shows the ported routines' hits.
# The picture is compared on every frame, 22 152 of them, nothing set aside (T82; docs/13-full-route.md,
# "The picture on the route"). Seven status periods show the bar as it stood, their redraw never
# reached on the original (220 frames, engine/conform/README.md); nine frames are past a few pixels,
# never three in a row, each a taken item the original erased behind the beam (frames 10 358,
# 11 699, 11 704, 13 438, 13 439, 15 761, 15 809, 15 813, 20 693).
