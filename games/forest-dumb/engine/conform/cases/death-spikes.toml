# T70: the last life lost on the spikes (scripts/death-spikes.txt), every object frozen: from frame 6400
# right held into the spike pit, where contact (the engine's CLXDAT, clxdat_copy) takes all 32 lives,
# the character never moved between them (no respawn); main_loop's check then shows the game over
# screen, compared frame by frame, and fire ends it where the original enters its high scores and the
# engine restarts the level (DESIGN §2.4). The hearts and lives digits are left out where main_loop's
# redraw reads lives after the next pass ran (frame 7742, about one life in 32): T71 models it (owner).
sync = { script = "boot-to-level1", frame = 6400 }
