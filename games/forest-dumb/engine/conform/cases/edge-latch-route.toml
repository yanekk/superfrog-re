# T73: the first 1 300 steps of T24's planner route (scripts/edge-latch-route.txt), nothing frozen,
# every variable fd_plan::confirm::VARS names compared on every pass,
# edge_latch_right included. Passes 1211 and 1228 latch an up row of 9 bobs and a right column: the
# next pass cuts the row's redraw, so the right latch stays set through it (docs/09, "The edge
# redraws and the next pass"). Goal: where the engine stands after the route, as confirm sets it.
# Since T47 springs and the animated cells run on both sides: the original's longer passes cut other
# rows (a row of no bobs at pass 328) and columns; the runner hands the engine where each pass cut
# main_loop's redraws, edge_latch_right compared on every pass (T74).
# Creatures live on both sides since T75: where a late pass cuts an edge redraw before its scan starts
# a creature, the runner hands the cut and the engine starts it after that pass too (docs/10).
# With them the route is enemy-route's: the passes named above are the frozen run's (docs/09).
