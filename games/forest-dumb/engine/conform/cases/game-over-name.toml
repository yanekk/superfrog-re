# Game over with a high score (forest-dumb-title T06, DESIGN §2.2, §2.3): as game-over-title, with
# score set to BCD 30000 as load_world is entered (nothing in play scores before the give-up), so
# high_scores asks for a name: A, B, Backspace, C, Return types "ac", which goes into the eighth
# entry before the table is sorted and shown; fire, then session_loop back into title_screen. The
# entry's rows are listed in `vars` so a difference in them is named; memory is compared every
# frame regardless. The name in the table is held on the original by tests/title_codes.rs.
# Measured on the original (T01): high_scores and hiscore_name_entry 6400, session_loop 6600,
# title_screen 7548. Translated engine only.
sync = { script = "boot-to-level1", frame = 4990 }
input = "game-over-name"
align = "loads"
swap = { frame = 3600, disk = 2 }
frames = 2620
compare = ["memory", "picture", "writes", "vars"]
vars = ["hiscore_name_8+$0", "hiscore_name_8+$4", "hiscore_name_8+$8", "hiscore_score_8"]
set = [{ var = "world_index", value = 1, when = "load_world" }, { var = "score", value = 0x30000, when = "load_world" }]
goal = { enters = "title_screen", by_frame = 7600 }
# Passes on the translated program and with level 1 mounted, measured 2026-11-20 (T06): memory,
# pictures, Paula's writes and the entry's vars equal, title_screen entered by both at 7549.
