# T47: the vanishing blocks (scripts/mechanic-vanish.txt): h0_6882 adds the column at W1-1:82,77..83 to
# h0_62b6's animated cells as it scrolls into view, h0_62b6 draws each block's frames and writes its
# collision_map cell. Jumps meet a block shown and gone; after the column has left the view and come
# back, the character stands on the block at 82,83. Every character, camera, edge, status and
# animation variable on every pass. Creatures live on both sides since T79, no life lost.
# Goal: on that block after the return, char_x $531 (under the column the first time it is $516),
# char_y $508.
# A long pass can come while main_loop still redraws, so main_loop's frame_flag clear swallows its
# latch: the runner hands the engine where each pass cut the redraws (T74, docs/09).
# Excluded: the play area's picture (T80). A creature the original cuts after the beam has passed it
# is missing from that frame; the engine shows it (59 frames here). The status bar's rows stay
# compared.
# Excluded: five of the fifteen creature slot variables (T81). Before pass 330 the next pass cuts the
# row redraw and the engine starts the creature at $429,$482 a pass before the original does: slot 0's
# flag and both slots' places differ on that pass, then the two slots' kind, facing and phase longs
# (`+$4` on 28 passes, `+$c` on 544). The other ten are compared.
