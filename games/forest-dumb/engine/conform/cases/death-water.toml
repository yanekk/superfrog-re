# T72: lives lost in W1-1's water (scripts/death-water.txt): frozen as freeze.rs says, which since T47
# leaves h0_6882 running, so the original adds the water to h0_62b6's animated cells and draws it, and
# the engine does the same (T25's port). The character drops into the pool at W1-1:148,66 to 149,66 (frame
# 7042); contact comes and goes with the water's frames, the third pass in a row costs a life (frame
# 7062), and after the hurt frame, the hold and the blink the next one (frame 7204). Creatures stay
# frozen. The original's pass grows with the animated cells' blits; a long pass has main_loop's
# frame_flag clear swallow its latch, so that row is redrawn a pass late, which the engine does not
# model (T74):
# edge_latch_down differs on 2 passes and edge_latch_up on 1, everything else and every frame equal.
# Creatures frozen on both sides (freeze.rs h0_681c, T75): live, a creature started at pass 571 a pass later in the
# original, its redraw cut short by a late pass (T46, FINDINGS).
sync = { script = "boot-to-level1", frame = 6301 }
