frames = 920
compare = ["vars", "picture"]
vars = ["clxdat_copy", "hits_taken", "lives", "char_dying", "char_dying_t", "char_unhurt_t", "char_anim_ptr", "char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_rising", "char_falling", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "char_slide_t", "items_left", "score", "irq_count", "countdown", "anim_tick"]
goal = { all = [{ var = "lives", value = 0x30 }], by_frame = 7221 }
