# T11: running, as T41's character-run-left (scripts/stretch-run.txt): left from the start to the wall at
# char_x $1b with a running jump on the way, then right back down the slope to char_x $fe, char_y $ea,
# the goal. Variables and picture together on every pass and frame. Nothing comes into view, so nothing
# is frozen. The countdown and its digits too since T23.
sync = { script = "boot-to-level1", frame = 6400 }
input = "stretch-run"
frames = 200
compare = ["vars", "picture"]
vars = ["char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_walk_t", "char_facing", "char_probe_1", "char_probe_2", "char_anim_ptr", "joy_left", "joy_right", "joy_up", "joy_down", "input_log_index", "char_jump_3b28", "char_jump_41b4", "char_jump_41b6", "char_dying_t", "char_dying", "char_rising", "char_falling", "char_probe_3", "char_probe_4", "char_probe_5", "char_probe_6", "char_slide_t", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "char_samples_0", "char_samples_4", "char_samples_8", "char_samples_c", "char_update_t", "char_unhurt_t", "edge_latch_right", "edge_latch_left", "edge_latch_up", "edge_latch_down", "edge_at_right_x", "edge_at_right_y", "edge_at_left_x", "edge_at_left_y", "edge_at_up_x", "edge_at_up_y", "edge_at_down_x", "edge_at_down_y", "lives", "hits_taken", "items_left", "score", "irq_count", "countdown"]
goal = { all = [{ var = "char_x", value = 0xfe }, { var = "char_y", value = 0xea }], by_frame = 6600 }
