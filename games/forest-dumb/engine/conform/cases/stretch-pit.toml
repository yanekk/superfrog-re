# T11: the pit's edge (scripts/stretch-pit.txt): right held from the start, the slide down the first slope
# flies off its end over the spike pit's edge and drops in, char_x $29d, char_y $21a (the goal), frame
# 6521. Frozen, as T42's pit case. Since T70 it runs on to 6600: the spikes cost a life at 6524
# (char_hit_check on the engine's CLXDAT, clxdat_copy compared), the hurt frame, the hold and the lives
# digit main_loop redraws. The pit's walls and the jumps out of it stay T42's character-edge-pit.
sync = { script = "boot-to-level1", frame = 6400 }
input = "stretch-pit"
frames = 200
compare = ["vars", "picture"]
vars = ["clxdat_copy", "char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_walk_t", "char_facing", "char_probe_1", "char_probe_2", "char_anim_ptr", "joy_left", "joy_right", "joy_up", "joy_down", "input_log_index", "char_jump_3b28", "char_jump_41b4", "char_jump_41b6", "char_dying_t", "char_dying", "char_rising", "char_falling", "char_probe_3", "char_probe_4", "char_probe_5", "char_probe_6", "char_slide_t", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "char_samples_0", "char_samples_4", "char_samples_8", "char_samples_c", "char_update_t", "char_unhurt_t", "edge_latch_right", "edge_latch_left", "edge_latch_up", "edge_latch_down", "edge_at_right_x", "edge_at_right_y", "edge_at_left_x", "edge_at_left_y", "edge_at_up_x", "edge_at_up_y", "edge_at_down_x", "edge_at_down_y", "lives", "hits_taken", "items_left", "score", "irq_count", "countdown"]
goal = { all = [{ var = "char_x", value = 0x29d }, { var = "char_y", value = 0x21a }], by_frame = 6522 }
freeze = true
