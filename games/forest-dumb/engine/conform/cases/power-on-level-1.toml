# The translated program from power-on into level 1 (translator T32, DESIGN §2.7, §2.8),
# boot-to-level1's input: power-on-title's way, then fire on START at 5000, world 1's loads, the
# SCENA 1 screen, fire at 6300, and the first 199 frames of play. The loads are instant on the
# translated side, so the frames are lined up at each load's return. Translated engine only.
# Fails today, measured 2026-11-12 (T32): power-on-title's frames to 5200, then the leftover-bus
# value of mt_end's `clr.w AUDxVOL` and COPJMP1 at 5001 (T47); the processor faster while world 1's
# level is built (T30's question): memory 5998 to 6025 (h0+$7a9c) and 6045 to 6057, writes 6054 and
# 6057; and from 6301 play's known differences (clxdat_copy, char_y, Paula a frame early: T30, T31).
# The goal is reached at 6400 on both sides: play runs from power-on.
sync = { script = "boot-to-level1", frame = 0 }
start = "entry"
align = "loads"
swap = { frame = 3600, disk = 2 }
frames = 6500
compare = ["memory", "picture", "writes"]
# Play has begun on both sides: the first 100 passes of game_frame counted (irq_count is 1 at the
# level sync point, frame 6301).
goal = { all = [{ var = "irq_count", value = 100 }], by_frame = 6500 }
