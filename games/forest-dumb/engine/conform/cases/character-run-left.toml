# T41: running left from the start to the wall at char_x $1b, a running jump on the way, then right
# back down the slope it started on, stopping where right is let go (char_x $fe). The character's LAYOUT
# variables on every pass; countdown is T23's.
sync = { script = "boot-to-level1", frame = 6400 }
input = "character-run-left"
frames = 200
compare = ["vars"]
vars = ["char_x", "char_y", "camera_x", "camera_y", "char_screen_x", "char_walk_t", "char_facing", "char_probe_1", "char_probe_2", "char_anim_ptr", "joy_left", "joy_right", "joy_up", "joy_down", "input_log_index", "char_jump_3b28", "char_jump_41b4", "char_jump_41b6", "char_dying_t", "char_dying", "char_rising", "char_falling", "char_probe_3", "char_probe_4", "char_probe_5", "char_probe_6", "char_slide_t", "char_jumped", "char_jump_t", "char_run_left", "char_run_right", "char_samples_0", "char_samples_4", "char_samples_8", "char_samples_c", "char_update_t", "char_unhurt_t", "lives", "hits_taken", "irq_count"]
goal = { all = [{ var = "char_x", value = 0xfe }, { var = "char_y", value = 0xea }], by_frame = 6600 }
exclude = [{ what = "var countdown", task = "T23" }]
