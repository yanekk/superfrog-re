# T45: taking items and bonuses (scripts/collect-ledge.txt), from the level sync point: the leap onto
# the ledge at W1-1:29..34,12 and jumps along it take every orange ($40, +20), apple ($41, +30) and
# coin ($20, $21, $23: +100, items_left -1) of the block above it. Score, items left and the
# status bar's digits on every pass and frame. Goal: score 810, items_left 278.
# Nothing frozen or excluded: since T47 the coins are drawn and springs run on both sides, since T75
# creatures.
# Creatures live on both sides since T75: where a late pass cuts an edge redraw before its scan starts
# a creature, the runner hands the cut and the engine starts it after that pass too (docs/10).
# The jumps along the ledge stomp a creature (irq_count 99, +250): 560 from the block and 250.
# T48 (2026-11-12), --engine translated, unproven until T49 (DMA contention) lands, carried to T50:
# first difference pass 58 (oracle frame 6360), creature_active+$1 $ff on the engine, 0 in the original;
# the machine starts that creature in frame 6359 at line 226, the original's pass cuts its scan there
# and it starts it in frame 6360 at line 163; the machine's edge-redraw scan starts a creature (h0_681c)
# before the pass at line 233 that cuts the original's scan (docs/10, "A creature start the next pass
# cuts"), so it runs a pass ahead.
