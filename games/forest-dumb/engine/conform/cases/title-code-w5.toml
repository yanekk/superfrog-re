# KODY with 7531, world 5's code, then START (forest-dumb-title T04, DESIGN §2.2, docs/16-title.md):
# world-5-start.toml's path with the world chosen by the typed code, not a `set`: from the idle
# title at 4990, KODY, the digits, START at 5128 (128 frames after world-5-start's), world 5's load,
# SCENA 5, fire, and 300 passes of play.
# Translated, measured 2026-11-20: passes, both sides reaching the goal (world_index 4, 300 passes) at oracle
# frame 6438 (T07; T04 read a difference from 5051, the first digit's key byte landing at once).
sync = { script = "boot-to-level1", frame = 4990 }
input = "title-code-w5"
align = "loads"
swap = { frame = 3600, disk = 2 }
frames = 1468
compare = ["memory", "picture", "writes"]
# Play has run 300 passes of game_frame in world 5 on both sides.
goal = { all = [{ var = "world_index", value = 4 }, { var = "cheat_flag", value = 0 }, { var = "irq_count", value = 300 }], by_frame = 6458 }
