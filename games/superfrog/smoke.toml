# What smoke runs for Superfrog (smoke-tests DESIGN §2.2, §2.4, §2.5). `tools/smoke.sh` checks this file.
# Fast means a file alone finishes in 10 s or less (plans/smoke-tests/timings.tsv). A slow file enters only for
# a crucial area, by named test where it holds more than the area needs. Times beside an area were measured
# alone with pir-test on 2026-10-31, on a busy machine.
workspace = "engine"

