[python]
"tools/test_architecture_docs.py" = "smoke"
"tools/test_check_no_disk_data.py" = "smoke"
"tools/test_disk_lookup.py" = "smoke"
"tools/test_handover.py" = "smoke"
"tools/test_no_bug_zips.py" = "smoke"
"tools/test_re_ghidra_import.py" = "smoke"
"tools/test_re_listing.py" = "smoke"
"tools/test_recording_guide.py" = "smoke"
"tools/test_render_levels.py" = "smoke"
"tools/test_template_sweep.py" = "smoke"

# 1.6 s
[[area]]
name = "reading the disks"
covers = ["crates/sf-disk/tests/real_disks.rs"]

# 4.6 s
[[area]]
name = "game data"
covers = ["crates/sf-assets/tests/levels.rs"]

# 15 s
[[area]]
name = "the original boots and repeats"
covers = ["crates/sf-oracle/tests/determinism.rs"]

# 40 s alone; the four named in front.rs together, 35 s
[[area]]
name = "power-on to the title"
covers = ["crates/sf-conform/tests/front.rs::power_on_to_the_title_matches_the_original"]

# 7 s for level_entry.rs; 25 s for the typed code, 2.7 s for the code table. level_entry starts at a level
# directly, so only the front.rs tests prove a code gets there.
[[area]]
name = "entering a level by its code"
covers = [
    "crates/sf-conform/tests/level_entry.rs",
    "crates/sf-conform/tests/front.rs::the_level_code_entry_matches_the_original",
    "crates/sf-conform/tests/front.rs::every_six_digit_code_starts_where_the_original_starts_it",
    "crates/sf-conform/tests/front.rs::each_world_and_level_has_a_code_that_starts_it",
]

# 22 s alone; with the next area, one call of 78 s
[[area]]
name = "the frog in one level"
covers = ["crates/sf-conform/tests/frog_cases.rs::frog_run_w1_1"]

# 85 s; fixed by the owner (DESIGN §2.5)
[[area]]
name = "W1-1 can be finished"
covers = ["crates/sf-conform/tests/frog_cases.rs::complete_w1_1_to_exit_fade"]

# 7.5 s and 4.2 s
[[area]]
name = "a sample of enemies"
covers = [
    "crates/sf-conform/tests/enemies_w1.rs::w1_1",
    "crates/sf-conform/tests/enemies_w1.rs::w1_activation",
]

# 7.2 s
[[area]]
name = "the picture"
covers = ["crates/sf-conform/tests/render_vs_oracle.rs"]

# 18 s and 15 s
[[area]]
name = "the sound"
covers = [
    "crates/sf-conform/tests/paula_vs_oracle.rs::channel_taps_are_the_references_at_every_clock_through_the_title_music",
    "crates/sf-conform/tests/audio_driver.rs::title_music_matches_the_full_system_oracle",
]

# 2.9 s and 1.8 s
[[area]]
name = "widescreen"
covers = [
    "crates/sf-core/tests/widescreen_camera.rs::at_w1_1s_start_the_wide_view_begins_at_level_x_16",
    "crates/sf-core/tests/widescreen_camera.rs::at_a_levels_right_end_the_camera_stops_65_earlier_and_the_frog_walks_on",
    "crates/sf-conform/tests/widescreen_switch.rs::switching_on_mid_level_wakes_an_enemy_in_the_right_strip",
]

# 6.1 s
[[area]]
name = "save states"
covers = [
    "crates/sf-core/tests/savestate.rs::a_loaded_level_runs_on_as_the_saved_one",
    "crates/sf-core/tests/savestate.rs::a_state_from_another_build_or_cache_is_refused",
    "crates/sf-core/tests/savestate.rs::a_damaged_or_foreign_file_is_refused",
]

# 10.6 s
[[area]]
name = "the bug recorder"
covers = [
    "crates/sf-conform/tests/recorder_replay.rs::the_replay_ends_on_the_screenshot_and_the_place",
    "crates/sf-conform/tests/recorder_replay.rs::a_changed_input_differs",
]

# 2.4 s and 10.9 s
[[area]]
name = "the route planner"
covers = [
    "crates/sf-plan/tests/reach.rs",
    "crates/sf-plan/tests/walk.rs::fill_goes_around_a_wall",
    "crates/sf-plan/tests/walk.rs::the_start_walks_at_least_as_far_as_straight",
    "crates/sf-plan/tests/walk.rs::walk_entries_carry_their_walking_coin_distance",
]

# 45 s
[[area]]
name = "the app starts"
covers = ["crates/sf-e2e/tests/smoke.rs"]

# 21 s
[[area]]
name = "its menus work"
covers = ["crates/sf-e2e/tests/menus.rs"]

# 17 s by name; the whole file takes 165 s
[[area]]
name = "its window opens"
covers = ["crates/sf-e2e/tests/window.rs::at_1x_2x_and_3x_the_window_is_that_multiple_and_the_picture_fills_it_unsmeared"]
