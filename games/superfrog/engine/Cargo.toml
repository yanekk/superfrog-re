# The Superfrog engine workspace. Pure crates (sf-disk, sf-assets, sf-core) hold the game, on the
# toolkit's pure crates (amiga-clock, amiga-chips, amiga-paula, amiga-input, amiga-disk in
# the repo root's toolkit/, by path); shell crates hold the app and the test tooling. The boundary is DESIGN §3.1,
# enforced by crates/sf-conform/tests/purity.rs. The toolkit crates' profile overrides are kept here
# as well as in toolkit/Cargo.toml, because a build reads them from the root manifest of the
# workspace it builds.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# The oracle's tests step the emulator thousands of frames and hash 1 MB of RAM per frame; its Rust
# side is optimised even in test builds so the test block stays within its time budget (T05).
[profile.dev.package.sf-oracle]
opt-level = 2

# The same for the harness itself, moved to the toolkit (toolkit-extract T05).
[profile.dev.package.amiga-oracle]
opt-level = 2

# The picture judges compare every pixel of every frame of a case, as sf-conform does (moved to the
# toolkit, toolkit-extract T06).
[profile.dev.package.amiga-conform]
opt-level = 2

# The mixer runs four channels at 3.5 MHz; the oracle comparison runs it for thousands of frames.
[profile.dev.package.amiga-paula]
opt-level = 2

# The copper run and the clock's loops run in every render and level test (one-clock T01).
[profile.dev.package.amiga-clock]
opt-level = 2

# The copper run is not generic, so it is compiled here and the render tests run it thousands of
# times (amiga-chips T02).
[profile.dev.package.amiga-chips]
opt-level = 2

# Decoding all of GameData (two IFF ANIMs, eight bob sheets) runs dozens of times in its tests.
[profile.dev.package.sf-assets]
opt-level = 2

# Its oracle tests compare the mixer's output with the reference at every Paula clock.
[profile.dev.package.sf-conform]
opt-level = 2

# The renderer draws thousands of transplanted frames in the conformance tests (T13).
[profile.dev.package.sf-core]
opt-level = 2

# The app encodes a PNG of every captured frame and converts every picture to RGBA: unoptimised,
# with the PNG crates, a frame costs more than a PAL frame's 20 ms, and a long scripted run
# (sf-e2e's power-on to W1-1, T193) falls behind the pacer and reaches its --timeout.
[profile.dev.package.sf-app]
opt-level = 2

# The app's game-free half, moved from sf-app (toolkit-extract T07): it encodes a PNG of every
# captured frame and converts every picture to RGBA. Unoptimised, a long scripted run falls behind
# the pacer, as sf-app did before its override (T193); sf-e2e's whole-game soak found it (T11).
[profile.dev.package.amiga-app]
opt-level = 2

# Moved from sf-core (frame input, toolkit-extract T02; the recorder, T09) and from sf-assets (the
# hunk and IFF readers, T04), each optimised before it moved.
[profile.dev.package.amiga-input]
opt-level = 2

[profile.dev.package.amiga-record]
opt-level = 2

[profile.dev.package.amiga-disk]
opt-level = 2

# The planner's coin choice, map and search are step-bounded loops over hundreds of targets and
# thousands of nodes; unoptimised, a W6 coin choice alone nears its 1 s test budget (smart-planner T06).
[profile.dev.package.sf-plan]
opt-level = 2

# The route viewer's tests replay whole routes, scanning the 300×84 map every frame.
[profile.dev.package.sf-routeview]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2
