# Attract mode (T20, T160, T162, T163): from power-on the title waits 400 frames, fades out, and
# the award pages, the hall of talent and the credits follow; then the attract demo's load,
# `demo_init` (case frame 3300), `level_start` (3314), the recording's play to the demo's exit fade,
# and the title's load after it (5121), so the cycle repeats. Around frame 2275 (the original's
# 6416) the credits scroll's blit meets the beam in row 229: those rows are counted as beam races
# (FINDINGS 2026-10-12).
sync = "power-on"
script = "boot-to-title"
frames = 5200
