[package]
name = "sf-conform"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The engine build (`SF_ENGINE_BUILD`) a pacing feed is tagged with, as the app's save states are:
# the same script, so the two cannot disagree on it (T211).
build = "../sf-app/build.rs"

[dependencies]
# The engine under test and the types it shares with the oracle.
sf-core = { path = "../sf-core" }
sf-assets = { path = "../sf-assets" }
sf-paula = { path = "../sf-paula" }
# The original, run by the reference emulator (sf-oracle's dev-dependency on this crate is a
# test-only cycle, which Cargo allows).
sf-oracle = { path = "../sf-oracle" }
# SHA-1 for the sync-point cache key.
sf-disk = { path = "../sf-disk" }
# Compresses the diff PNG (already in the workspace for sf-oracle's traces).
miniz_oxide = "0.9.1"
# Case files are TOML (T12 interface).
toml = "0.9"
# Reads a bug zip's screenshot back (bug-recorder T04); the app writes it with the same crate.
png = "0.18"

[dev-dependencies]
