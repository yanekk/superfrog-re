[package]
name = "sf-assets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Save states (T26): the types a game holds derive serde, so sf-core can write the game out.
serde = { version = "1", features = ["derive"] }
sf-disk = { path = "../sf-disk" }

[dev-dependencies]
# Finds the owner's disks (tests only; the levels and graphics tests need the real content).
sf-conform = { path = "../sf-conform" }
# Checks the hand-written BLAKE3 in src/blake3.rs (tests only; the crate itself builds with `cc`).
blake3 = "1"
# Plays `.sflevel` files against the disk levels (tests only; sf-core depends on this crate).
sf-core = { path = "../sf-core" }
