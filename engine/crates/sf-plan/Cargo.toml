[package]
name = "sf-plan"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The engine build (`SF_ENGINE_BUILD`) the map cache is keyed by (DESIGN §2.8), from the app's own
# script, so the two cannot disagree on it.
build = "../sf-app/build.rs"

# The smart planner (plans/smart-planner DESIGN §3). `src/core/` is pure: it takes game states and
# level facts as arguments and may step sf-core; everything with a clock, a file or the oracle is
# shell (tests/purity.rs).

[dependencies]
sf-core = { path = "../sf-core" }
sf-assets = { path = "../sf-assets" }
serde = { version = "1", features = ["derive"] }
# Map cache files (DESIGN §5: already in the workspace through sf-core).
bincode = "1.3.3"

[dev-dependencies]
# The disks' GameData, for the tests' level starts.
sf-conform = { path = "../sf-conform" }
