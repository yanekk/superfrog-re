[package]
name = "sf-plan"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The engine build (`SF_ENGINE_BUILD`) the map cache is keyed by (DESIGN §2.8), from the app's own
# script, so the two cannot disagree on it.
build = "../sf-app/build.rs"

# The smart planner (plans/smart-planner DESIGN §3). `src/core/` is pure: it takes game states and
# level facts as arguments and may step sf-core; everything with a clock, a file or the oracle is
# shell (tests/purity.rs).

[dependencies]
sf-core = { path = "../sf-core" }
sf-assets = { path = "../sf-assets" }
serde = { version = "1", features = ["derive"] }
# Map cache files (DESIGN §5: already in the workspace through sf-core).
bincode = "1.3.3"
# Peak resident memory for the report (`run::peak_rss_bytes`; already in the workspace through sf-bench).
libc = "0.2"
# The shell plays guide scripts on the original (`trace`, DESIGN §2.11) and, from T10, confirms
# routes there. `tests/purity.rs` bars both from `src/core/`.
sf-conform = { path = "../sf-conform" }
sf-oracle = { path = "../sf-oracle" }

[dev-dependencies]
# T12 review: the planner's `app::app_start` held to set C's verification start, the one sf-e2e's
# `plan_routes.rs` checks against the real app (sf-bench never links sf-plan, so no cycle).
sf-bench = { path = "../sf-bench" }

[[bin]]
name = "sf-plan"
path = "src/main.rs"
