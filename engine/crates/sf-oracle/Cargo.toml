[package]
name = "sf-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The emulator, the routine runner and the trace cache (toolkit-extract T05).
amiga-oracle = { path = "../../../toolkit/crates/amiga-oracle" }
# Reads the zipped or raw disks and names them by slot (T03).
sf-disk = { path = "../sf-disk" }

[dev-dependencies]
# Finds the owner's disks for the ATN! cross-check (tests only; sf-conform has no dependencies).
sf-conform = { path = "../sf-conform" }
# Superfrog's memory layout, for the tests that read the game's variables.
sf-core = { path = "../sf-core" }
