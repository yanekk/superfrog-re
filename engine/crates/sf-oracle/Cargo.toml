[package]
name = "sf-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true
links = "sfshim"

[dependencies]
sf-core = { path = "../sf-core" }
sf-paula = { path = "../sf-paula" }
# Reads the zipped or raw disks and names them by slot (T03).
sf-disk = { path = "../sf-disk" }
# Compresses cached traces (already in the workspace for sf-disk).
miniz_oxide = "0.9.1"

[build-dependencies]
# Compiles the C++ shim over the vAmiga core.
cc = "1"
# SHA-1 of the patch set, to find the build tools/setup/oracle.sh made (same hash as the script).
sf-disk = { path = "../sf-disk" }
