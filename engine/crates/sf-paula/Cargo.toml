[package]
name = "sf-paula"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The frame and line lengths and the beam position (a toolkit crate).
amiga-clock = { path = "../amiga-clock" }
# Save states (T26): the types a game holds derive serde, so sf-core can write the game out.
serde = { version = "1", features = ["derive"] }
