[package]
name = "sf-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "superfrog"
path = "src/main.rs"

[dependencies]
# The game and its data (DESIGN §3.1). Never sf-oracle: the shipped game may not contain an emulator.
sf-disk = { path = "../sf-disk" }
sf-assets = { path = "../sf-assets" }
sf-core = { path = "../sf-core" }
sf-paula = { path = "../sf-paula" }
# The window and its events (DESIGN §3.2).
winit = "0.30"
# Integer scaling on the GPU, and later the CRT shader (DESIGN §2.7, §3.2).
wgpu = "30"
# Blocks on wgpu's adapter and device requests at start-up.
pollster = "0.4"
# The audio device, whose sample clock paces the game (DESIGN §2.5).
cpal = "0.16"
# Captured frames are PNGs a person or a test can open (DESIGN §5, End to end).
png = "0.18"
# The --timeout seatbelt stops the app's whole process group (DESIGN §5.2).
libc = "0.2"
# The native disk picker and the import's messages (DESIGN §2.2, §2.11).
rfd = "0.15"
# The native menu bar every setting and feature lives in (DESIGN §2.7, §7; T24).
muda = "0.21"
# settings.toml, progress.toml and disks.toml (DESIGN §2.9, §3.5).
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Gamepads, hot-plugged, fed onto the same original inputs as the keys (DESIGN §2.6, §3.2; T25).
gilrs = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# One AppKit default: keep AppKit from adding its own "Enter Full Screen" to the View menu (menu.rs).
objc2 = "0.6"
# The Controls window's native labels and buttons (T25), on a window winit opens; NSPasteboard puts a
# saved bug zip's path on the clipboard (bug-recorder T06); the Start Level window is an NSWindow of
# its own run modally, with NSPopUpButton dropdowns, taking ⌘A/⌘C/⌘V itself (bug-recorder T08).
# The recording bar is an NSBox strip on the game window (bug-recorder T09).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSControl", "NSButton", "NSTextField", "NSText", "NSColor", "NSFont", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSPasteboard", "NSWindow", "NSApplication", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSCell", "NSGraphics", "NSEvent", "NSBox", "NSFontDescriptor", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSDictionary", "NSValue", "NSGeometry", "NSObject"] }
