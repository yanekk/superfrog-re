# frame, so the original's handler serves two blanks; conformance feeds which frames had one.
# The effects' ramps keep in step; the draws' ends (DMACON $400) still miss (T53, T54). Slow
# (about 80 s): not in the test block; `sf-conform scan` it.
sync = "power-on-disk3"
frames = 5200
