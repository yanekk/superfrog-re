# The whole game (T202, T205, T206): power-on with an empty df1 connected (W6-2..4's first map set,
# as the engine plays them; docs/10), START GAME, then each level's route spliced at the frame its
# first frame plays, as `examples/whole_game` assembled it on the original; W1-1's tally takes the
# slot machine. W1-1 plays its standalone route, W1-2..W4-4 their `chain-*` routes (planned from the
# original's state at the level's start in the chain, T205, T206), every level completed with no
# life lost; the script stops at W5-1's first frame (the original's 170002). `frames` is the
# engine's (loads skipped): the original runs 12962 frames ahead by 125722 and 14659 by 167516, so
# 157050 reaches W5-1's first frame for sure, the frog then idle in W5-1 for up to 1700 frames.
# Divergences: FINDINGS, T205, T206.
sync = "power-on-df1"
script = "game-whole"
frames = 157050
lag-limit = { frames = 390, note = "the longest run of frames ending mid-pass met on the way: 390 from frame 125461, W4-3 at chain-w4-3's ~3300 (the original's 138423), the stretch where complete-w4-3 met 261 (T181): W4-3's passes run longer than a frame from its 3300; check 4 covers them (T206)" }
