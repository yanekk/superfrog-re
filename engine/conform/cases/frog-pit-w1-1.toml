# The frog runs into W1-1's first pit and dies: the fall, the hazard (frog_kill), the death sample
# and animation; at frame 277 the level's loop ends (`player_died`) and `level_exit_fade` fades the
# palette out and closes the window; `level_init_w1` runs again over frames 293–307, `level_start`
# fades the level in and slides the panel in a step a frame, and the level's loop runs again from
# frame 332 (T37). Run on through the second death (612) and restart to 900 frames (T100).
sync = { level = "W1-1" }
script = "frog-pit"
frames = 900

[[exclude]]
what = "objects"
note = "the original's object spawns, bump blocks and tile pickups return at once from power-on; the engine runs frog-only"
task = "T36 (items in frame cases), T16–T18 (enemies)"

[[exclude]]
what = "picture"
frames = [658, 658]
note = "the copper reads colour 31 on line $34 between the fade in's `andi.w #$fff0,(a0)` and `add.w d3,(a0)` (the original shows $ee0, blue cleared): a 12-cycle window no timing model short of the bus's own reaches (owner, T100)"
task = "T100"
