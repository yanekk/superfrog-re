[package]
name = "amiga-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The game-free parts of a desktop app that plays an Amiga game (a shell crate): sound out, PAL
# frame pacing, gamepads, the picture on the GPU, capture files, atomic writes, the single-copy
# lock, the Amiga key table, settings.toml, the Controls, Start Level, recording bar and save
# windows, and a script's game-free lines. The run loop, game window and menus stay the game's.
[dependencies]
# Picture and its 12-bit colours, what the window draws (a toolkit crate).
amiga-chips = { path = "../amiga-chips" }
# The PAL clock and frame lengths the pacer counts in (a toolkit crate).
amiga-paula = { path = "../amiga-paula" }
# Joy, KeySet and FrameInput, what the keys and pads feed (a toolkit crate).
amiga-input = { path = "../amiga-input" }
# The window the picture is drawn on, and the host key codes.
winit = "0.30"
# Integer scaling on the GPU, and the CRT filters.
wgpu = "30"
# Blocks on wgpu's adapter and device requests at start-up.
pollster = "0.4"
# The audio device, whose sample clock paces the game.
cpal = "0.16"
# Captured frames are PNGs a person or a test can open.
png = "0.18"
# flock for the single-copy lock; proc_pid_rusage for the capture's memory figures.
libc = "0.2"
# Gamepads, hot-plugged.
gilrs = "0.11"
# settings.toml.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The Controls window's labels and buttons on a window winit opens; Start Level, an NSWindow of its
# own run modally with NSPopUpButton dropdowns, taking ⌘A/⌘C/⌘V itself; the save window, an
# NSWindow sheet with an NSImageView and an NSAlert for a write that fails; the recording bar, an
# NSBox strip on the game window. The versions and features the first game's app used, and block2 for
# the sheet, which its workspace had switched on through another crate.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSControl", "NSButton", "NSTextField", "NSText", "NSColor", "NSFont", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSPasteboard", "NSWindow", "NSApplication", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSCell", "NSGraphics", "NSEvent", "NSImage", "NSImageView", "NSImageCell", "NSTextFieldCell", "NSAlert", "NSBox", "NSFontDescriptor", "objc2-core-foundation", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSData"] }

[dev-dependencies]
# MAX_FRAMES, the longest recording the bar's clock must show (a toolkit crate).
amiga-record = { path = "../amiga-record" }
