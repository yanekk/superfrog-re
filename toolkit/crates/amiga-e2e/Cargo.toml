[package]
name = "amiga-e2e"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Test tooling (a shell crate): drives a game's real app end to end. It launches the binary in its
# own process group with a scratch home, feeds it a script, reads back its captures and, through
# the OS layer, posts real keys, clicks real menus and captures the real window. Everything that
# names the app comes from the game's `AppSpec`.
[dependencies]
# Picture and its 12-bit colours, which a captured frame is compared with (a toolkit crate).
amiga-chips = { path = "../amiga-chips" }
# The capture folder's file names, so the app and the driver cannot drift apart (a toolkit crate).
amiga-app = { path = "../amiga-app" }
# Reads the app's captured frames and the OS layer's window captures.
png = "0.18"
# Launches the app in its own process group and checks the group is gone afterwards.
libc = "0.2"
