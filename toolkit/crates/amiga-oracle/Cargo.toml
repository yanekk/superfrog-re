[package]
name = "amiga-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true
links = "amigashim"

[dependencies]
# AmigaMemory, the RAM type the engine side compares against without converting.
amiga-chips = { path = "../amiga-chips" }
amiga-paula = { path = "../amiga-paula" }
# FrameInput, the input the emulator is driven with.
amiga-input = { path = "../amiga-input" }
# SHA-1 for the trace cache keys, and the hunk reader `Cpu68k::load_exe` walks.
amiga-disk = { path = "../amiga-disk" }
# Compresses cached traces.
miniz_oxide = "0.9.1"

[build-dependencies]
# Compiles the C++ shim over the vAmiga core.
cc = { version = "1", features = ["parallel"] }
# SHA-1 of the patch set, to find the build toolkit/tools/setup/oracle.sh made (same hash as the script).
amiga-disk = { path = "../amiga-disk" }
