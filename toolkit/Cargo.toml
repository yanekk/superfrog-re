# The Amiga toolkit: the parts of an Amiga game's engine that carry to another game. Pure crates
# (amiga-clock, amiga-chips, amiga-paula, amiga-input, amiga-disk, amiga-record) model the machine,
# its disk formats and a game's recorded input, and read no clock, file or network; the boundary
# is enforced by crates/toolkit-checks/tests/purity.rs, and no game's name enters this tree
# (tools/check_tier_names.py at the repo root). Shell crates (amiga-oracle, the reference emulator;
# amiga-conform, the game-free half of a conformance harness) are test tooling. Games depend on
# these crates by path.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Profile overrides are read from the root manifest of the workspace being built, so a game's
# workspace keeps its own copy of these; without them the toolkit's own tests run unoptimised.

# The copper run and the clock's loops run in every render test.
[profile.dev.package.amiga-clock]
opt-level = 2

# The copper run is not generic, so it is compiled here and the render tests run it thousands of
# times.
[profile.dev.package.amiga-chips]
opt-level = 2

# The mixer runs four channels at 3.5 MHz, for thousands of frames in a comparison.
[profile.dev.package.amiga-paula]
opt-level = 2

# The oracle's tests step the emulator thousands of frames and hash 1 MB of RAM per frame.
[profile.dev.package.amiga-oracle]
opt-level = 2

# The picture judges compare every pixel of every frame of a case.
[profile.dev.package.amiga-conform]
opt-level = 2

# A desktop app's game-free half: a PNG of every captured frame and every picture to RGBA, run at
# the PAL rate by a game's end-to-end tests.
[profile.dev.package.amiga-app]
opt-level = 2

# Frame input, recordings and the disk readers run over whole games in a game's tests; each was
# optimised in the game's workspace before it moved here.
[profile.dev.package.amiga-input]
opt-level = 2

[profile.dev.package.amiga-record]
opt-level = 2

[profile.dev.package.amiga-disk]
opt-level = 2

# The planner's archive, compasses and search are step-bounded loops over hundreds of targets and
# thousands of cells, stepping a game's engine every frame; unoptimised, a game's planner tests miss
# their time budgets. Every game workspace that builds it keeps its own copy of this override.
[profile.dev.package.amiga-plan]
opt-level = 2
